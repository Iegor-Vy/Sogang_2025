# A result leaves a question

**Fictional example:** a survey finds that frequent AI users report lower confidence in their reasoning.

What could interviews help us understand?

What could they **not establish on their own**?

Think for 30 seconds, then hear two responses.

???
2 minutes. Possible answers: what reliance means, how students use AI, why they feel less confident, and context. Interviews alone do not estimate a population prevalence or establish an average causal effect. This is a hypothetical finding, not a published result.

# 1. Qualitative questions, assumptions, and collection methods



???
Foundations: 16 minutes, elapsed 8–24.

---

# Questions about meaning, experience, and process

Qualitative research examines how people understand and act within particular contexts.

Evidence may include interviews, observations, documents, images, and interactions.

Examples:

- How do students decide when to trust an AI answer?

- What does financial insecurity mean in everyday life?

- How do residents experience a new local policy?

???
3 minutes. “How” and “why” questions can also be quantitative. Qualitative research is defined by its inquiry and analysis, not a question word or the absence of numbers. Hypotheses may emerge, but some qualitative studies also examine existing theoretical expectations.

---

class: small

# Question, approach, method, and analysis

| Decision | Example |
|---|---|
| Research question | How does a student group negotiate acceptable AI use? |
| Approach | A bounded case study of that group |
| Data collection | Interviews, meeting observations, and policy documents |
| Analysis | Compare accounts, practices, and documents for patterns |

“Conduct interviews” describes a method, but leaves the broader design unexplained.

???
3 minutes. An interview is not automatically phenomenology; coding is not automatically grounded theory. These five approaches are useful traditions, not an exhaustive classification. A carefully justified qualitative descriptive study can also be appropriate. Case studies may use qualitative, quantitative, or mixed evidence.

---

# Assumptions influence interpretation

**Ontology:** What do we assume exists in the social world?

**Epistemology:** What can count as knowledge about it?

A critical realist may study underlying conditions while recognizing that accounts are partial. An interpretivist may emphasize how people construct meanings in context.

**Reflexivity:** How might your position and assumptions shape what you ask, notice, and conclude?

???
3 minutes. These are illustrative positions, not an exhaustive or mutually exclusive taxonomy. Critical realism is not the claim that only individual perceptions exist. Interpretivism need not deny material conditions. Ask how being a classmate rather than an instructor could alter an interview about AI use. Avoid treating bracketing as complete elimination of perspective.

---

# Reasoning can move in several directions

- **Induction:** recurring observations suggest a pattern.

- **Deduction:** an existing explanation guides what you examine.

- **Abduction:** a surprising observation prompts a possible explanation that you investigate further.

Example: students use AI frequently but describe very different learning practices.

**What would you ask next?**

???
3 minutes. A plausible next step is to examine purpose of use rather than frequency alone. Qualitative inquiry can combine these modes. Evidence can challenge or revise an explanation; a single interview does not prove a theory.

---

class: small

# Choosing a way to collect evidence

| Method | Useful when you need… | Design issue |
|---|---|---|
| Interview | An individual account | Recall and interviewer influence |
| Focus group | Interaction around a shared issue | Dominant voices and confidentiality |
| Observation | Practices in a setting | Access and observer influence |
| Document analysis | Recorded rules, narratives, or decisions | Authorship, purpose, and missing voices |

Choose evidence that can answer the question.

???
4 minutes. These methods can appear within several approaches. A public document does not transparently describe all practices; interviews and observations can also diverge. No requirement to collect every kind of evidence.

# Five approaches: different research purposes

&lt;img src="p2.png" style="width:80%; display: block; margin-left: auto; margin-right: auto;" /&gt;

???
2 minutes. Original figure retained. Preview the distinctions: story, lived experience, developing explanation, shared practices, bounded case. Labels must match the work actually undertaken.

---

# Narrative inquiry: a story over time

**Focus:** how a person or people tell and make sense of experiences over time.

**Example question:** How does an entrepreneur narrate failure and a later return to business?

**Evidence:** repeated interviews, diaries, or other records.

**Interpretation:** sequence, turning points, context, and how the story is told.

???
3 minutes. Distinguish chronology from merely listing interview themes. A narrative is an account shaped by memory, audience, and context, not a transparent recording of events. Collaboration or participant feedback can be useful, but is not a universal validation requirement. The published narrative example is in the gallery.

---

# Phenomenology: lived experience

**Focus:** the meaning of a shared experience for people who have lived it.

**Example question:** What is it like to become a father while still an adolescent?

**Evidence:** detailed accounts from people with relevant experience.

**Interpretation:** what the experience means and how context shapes it.

???
3 minutes. Descriptive and interpretive traditions differ. Textural and structural descriptions and an “essence” characterize particular phenomenological approaches, not every study. Reflexive attention to assumptions is important. Interviews are common, not the only permissible evidence. Do not equate phenomenology with introspection alone.

---

# Grounded theory: developing an explanation

**Focus:** generate an explanatory account of a process through iterative analysis.

**Example question:** How do students develop a leadership identity?

Collect evidence, compare cases, develop categories, and seek further evidence to refine them.

**Coding alone does not establish a grounded-theory design.**

???
3 minutes. Explain constant comparison and theoretical sampling in ordinary language. Researchers select further evidence based on emerging analytical needs. A full grounded-theory study is often too ambitious for a short undergraduate project. Prior theory is handled differently across traditions; researchers do not universally begin with a blank mind.

---

# Ethnography: shared practices in context

**Focus:** everyday practices, meanings, and relationships within a group or setting.

**Example question:** How does a student society develop informal rules about AI use?

**Evidence:** sustained engagement, observation, fieldnotes, interviews, and artifacts.

A single brief visit usually cannot support a claim to a full ethnography.

???
3 minutes. Culture-sharing groups are not synonymous with nationalities or homogeneous communities. Ethnographic work may be multi-sited or digital, subject to ethical access. A focused observation exercise can teach a skill without being presented as a complete ethnography.

---

# Case study: a bounded case in context

**Focus:** an in-depth investigation of a clearly defined case.

**Example:** one university's implementation of an AI policy during one semester.

**Evidence:** policy documents, interviews, and observations considered together.

Define the case, its boundaries, and why it helps answer the question.

???
3 minutes. An intrinsic case is of interest in itself; an instrumental case helps understand a broader issue. Multiple-case work needs a common phenomenon and reasoned case selection. Correct original “quitain”: “quintain” is specialized terminology for the common object in some multiple-case traditions, not required vocabulary here. A small sample is not automatically a case study.

---

# Pair challenge: same topic, different designs

**Topic:** adapting to university life.

Assign an approach to each question:

1. How does one student's account of belonging change over time?

2. What is the lived experience of feeling excluded?

3. How do students move from avoiding help to seeking it?

4. What informal practices shape belonging in one student society?

5. How did one university implement its mentoring program?

For one question, name the evidence you would need.

???
7 minutes: six pairs discuss 3; five brief answers and debrief 4. Likely matches: narrative, phenomenology, grounded theory, ethnography, case study. These are best-fit starting points, not automatic classifications from wording. Require a design explanation; accept alternatives with appropriate changes in purpose, evidence, and analysis.

# 2. Sampling, protocols, access, and ethics



???
15 minutes, elapsed 20–35.

---

# Sampling follows the question

**Purposive sampling:** select people, documents, or cases because they can inform the question.

Possible reasons: relevant experience, contrasting situations, or a critical case.

Ask: **Who or what would my easiest sample miss?**

There is no universal qualitative sample size. Scope, diversity, evidence quality, and the approach matter.

???
4 minutes. Convenience alone needs acknowledgement. Saturation is not a fixed-number guarantee or a universal requirement across all qualitative approaches. Do not use the original comparison image’s sample-size ranges as course rules. Ask how interviewing only friends might narrow the accounts available.

---

# A protocol makes collection consistent

A **protocol** is a short plan for how you will collect evidence.

Include:

- the purpose, selection criteria, and access arrangements;

- an opening explanation and consent procedure;

- core questions or observation/document prompts;

- recording, note-taking, storage, and closing procedures.

**Quick check:** What would change for document analysis?

???
4 minutes. For documents, specify source, date range, inclusion criteria, provenance, permissions, and what to record from each item. For observation, define setting, role, access, and a fieldnote guide. For a focus group, plan turn-taking and explain that confidentiality among participants cannot be guaranteed. A protocol supports consistency without preventing appropriate follow-up questions. Students adapt this to their memo and practice.

---

# Ethics is part of the design

Before collecting participant data, clarify:

- voluntary, informed participation and the ability to skip questions;

- permission for recording and use of quotations;

- what you will store, who can access it, and when it will be deleted;

- limits to anonymity, especially in a small class or group;

- instructor approval and applicable institutional review requirements.

Do not upload identifiable material to public repositories or AI services.

???
4 minutes. This lecture does not grant permission to recruit participants. Avoid promising absolute anonymity. Public availability of online content does not remove all ethical concerns. Use de-identified or fictional material for practice. Source: UK Data Service, consent and qualitative data guidance.

---

# Ethics decision: a class group chat

A student wants to screenshot a private class chat to study stress. They plan to remove names and upload it to an AI tool for coding.

**Pairs · 1 minute:** identify two problems and one safer alternative.

What would you need to resolve before proceeding?

???
3 minutes: pairs 1, debrief 2. Removing names may not remove identifying context. Participation and reuse consent, third-party data processing, and sensitive information remain issues. Safer options: a fictional dataset or appropriately licensed public documents, with a justified scope. Do not give legal assurances or treat a platform’s settings as consent.

---

# 3. Interview practice and feedback



???
18 minutes, elapsed 35–53.

---

# Questions that invite an account

**Leading:** “Why does AI make students lazy?”

**Open:** “Can you describe a recent task where you considered using AI?”

Possible probes:

- “What happened next?”

- “What influenced that decision?”

- “Can you give an example?”

Ask one question at a time and allow silence.

???
4 minutes. Ask students to repair one leading question aloud. Avoid assuming harm, benefit, or use. Probe rather than argue with an answer. This prepares the role-play; it is not an interrogation technique.

---

# Practice in four groups of three

**12 minutes · three rounds of four minutes**

Rotate: **interviewer, participant, observer**.

Safe topic: how a fictional student decides where to study.

Each round: interview for 2 minutes, observer feedback for 1, revise and rotate for 1.

Observer checks: open question, neutral probe, listening, and an unsupported assumption.

???
12 minutes. Everyone performs every role. Participants may invent the entire scenario or decline personal disclosure. No recording, names, sensitive questions, or research use of classmates’ answers. The activity tests interviewing technique, not substantive findings.

---

# Debrief: what changed the answer?

Name one question that opened up a useful account.

Name one assumption the interviewer had to reconsider.

**Reflexivity note:** “My wording or position may have influenced ______.”

???
2 minutes. Take two brief responses. Good interviewing does not eliminate influence; it makes it more thoughtful and visible. Save analytical coding for Week 6.

---

# Your memo: a feasible qualitative design

**Write individually · 8 minutes · about 200–300 words**

Include:

1. Question and connection to your final research project

2. Approach and a reason it fits

3. Participants, documents, or case, with selection and access plan

4. Three open questions or document/observation prompts

5. Ethics, one limitation, and one reflexive consideration

A justified document-based design is welcome.

???
8 minutes. Build on Tuesday’s sketch and interview feedback. All students practice a qualitative design, but the final project may remain quantitative when that fits the research question. This is a design exercise, not authorization to collect data. Short numbered paragraphs are acceptable.

# Peer review and revision

**Six pairs · 10 minutes**

- Read your partner's memo: 3 minutes.

- Discuss one strength and one specific improvement: 4 minutes.

- Revise your own memo: 3 minutes.

Check the fit between **question, approach, evidence, and claim**.

Add one sentence explaining your revision.

10 minutes. Each student must receive feedback. Review is about clarity, feasibility, and reasoning, not whether the reviewer personally likes the topic. Do not require everyone to present again.

# Week 6 reference: mixed-methods integration

| Sequence | Example |
|---|---|
| Qualitative first | Interviews inform a survey's categories |
| Quantitative first | Interviews investigate an unexpected survey pattern |
| In parallel | Compare survey patterns with accounts of the same issue |

Explain **where and how** the evidence will inform a joint interpretation.

???
Reference only, not taught as a Week 5 topic. Week 6 develops integration alongside interpretation and triangulation. Combining two tools without integration does not by itself make a coherent mixed-methods design. Breadth and depth are useful shorthand, not fixed properties. Ask whether their own question needs both routes; a single well-chosen method may be more feasible. Avoid adding interviews only to decorate a quantitative project.
