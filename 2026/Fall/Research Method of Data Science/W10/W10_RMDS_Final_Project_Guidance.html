# Your individual final research project

**Week 10 progress conversation**

What you should have now, what we will build next, and how the paper comes together.

Our destination: **a small, coherent study that you can explain and support with evidence.**

???
Instructor use: a project briefing to insert into Week 10, rather than a replacement for both Week 10 lessons. Allow approximately 30 minutes for slides 1–23, with selective explanation rather than reading every bullet, then 5 minutes for the progress conversation on slide 24. Slides 25–32 are reference material for students. Basis: final TIC3002 syllabus, particularly course objectives, SectionIV final assignment, and Weeks 9–16, together with the instructor’s current clarification about manageable scope. No page/word quota, source-count quota, new grading split or exact deadline is introduced. The final project remains individual, with a complete paper, supporting materials and presentation. Preserve qualitative, quantitative and mixed-method choices when justified.

---

class: balanced

# Agenda

&lt;div class="section-kicker"&gt;OUR PROJECT CONVERSATION&lt;/div&gt;

&lt;div class="paper-map"&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;1 · Destination&lt;/strong&gt;What the final project should accomplish&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;2 · Today&lt;/strong&gt;Where your project should be in Week 10&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;3 · Paper&lt;/strong&gt;What belongs in each section&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;4 · Path&lt;/strong&gt;How Weeks 11–14 build the draft&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;5 · Finish&lt;/strong&gt;Presentation, revision, and submission&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;Appendix&lt;/strong&gt;Checklists, project map, and obstacles&lt;/div&gt;
&lt;/div&gt;

???
Briefly explain the sequence. Students already have project work from earlier weeks. Today clarifies how those pieces become one study; it does not assign a new proposal.

---

class: balanced

# 1. What I expect from the final project

&lt;div class="takeaway"&gt;Your project investigates &lt;strong&gt;one focused question&lt;/strong&gt; using evidence you can actually obtain, understand, and explain.&lt;/div&gt;

&lt;div class="check-grid"&gt;
  &lt;div class="check-item"&gt;A manageable scope and a clear reason for the study&lt;/div&gt;
  &lt;div class="check-item"&gt;Relevant literature connected to the question&lt;/div&gt;
  &lt;div class="check-item"&gt;A transparent approach to evidence and analysis&lt;/div&gt;
  &lt;div class="check-item"&gt;Findings that answer the question within stated limits&lt;/div&gt;
  &lt;div class="check-item"&gt;A complete, readable paper with meaningful content&lt;/div&gt;
&lt;/div&gt;

???
Emphasize a coherent undergraduate study. A limited but well-executed comparison, small qualitative inquiry, or modest association analysis can be suitable. Complexity and quantity alone do not establish quality.

---

class: balanced

# A complete structure with a manageable scope

&lt;div class="compare-grid"&gt;
  &lt;div class="compare-card"&gt;&lt;h3&gt;Keep the scope realistic&lt;/h3&gt;&lt;p&gt;I do &lt;strong&gt;not&lt;/strong&gt; expect a full-scale, publication-ready journal article.&lt;/p&gt;&lt;p&gt;Limit the setting, period, dataset, cases, or documents.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="compare-card" style="border-top-color:#136f63;"&gt;&lt;h3&gt;Keep the study complete&lt;/h3&gt;&lt;p&gt;Every required section must still do its job.&lt;/p&gt;&lt;p&gt;A heading plus “I will analyse this later” is not a finished section.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="takeaway"&gt;&lt;strong&gt;Depth&lt;/strong&gt; comes from explaining your decisions and evidence clearly—not from making the project large.&lt;/div&gt;

???
This is the central clarification requested by the instructor. Limited scope is different from omitting sections or submitting only a plan. Students do not need a groundbreaking discovery, many datasets or the most advanced model.

---

class: small

# One question connects the whole paper

&lt;div class="question-chain"&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Literature&lt;/strong&gt;What do we know?&lt;/div&gt;&lt;div class="chain-arrow"&gt;→&lt;/div&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Evidence&lt;/strong&gt;What can I observe?&lt;/div&gt;&lt;div class="chain-arrow"&gt;→&lt;/div&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Method&lt;/strong&gt;How will I answer?&lt;/div&gt;&lt;div class="chain-arrow"&gt;→&lt;/div&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Results&lt;/strong&gt;What did I find?&lt;/div&gt;&lt;div class="chain-arrow"&gt;→&lt;/div&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Meaning&lt;/strong&gt;How far can it go?&lt;/div&gt;
&lt;/div&gt;

&lt;div class="caution"&gt;&lt;strong&gt;Alignment check:&lt;/strong&gt; if these parts address different questions, the paper needs revision.&lt;/div&gt;

???
Use one student example if helpful. A question about actual learning cannot be answered solely by a measure of satisfaction without explaining and narrowing the intended claim.

---

class: balanced

# 2. Where you should be in Week 10

&lt;div class="metric-grid"&gt;
  &lt;div class="metric-card"&gt;&lt;span class="number"&gt;1&lt;/span&gt;&lt;span class="label"&gt;&lt;strong&gt;Question&lt;/strong&gt;&lt;br&gt;Working and scoped&lt;/span&gt;&lt;/div&gt;
  &lt;div class="metric-card"&gt;&lt;span class="number"&gt;2&lt;/span&gt;&lt;span class="label"&gt;&lt;strong&gt;Review&lt;/strong&gt;&lt;br&gt;Organised by themes&lt;/span&gt;&lt;/div&gt;
  &lt;div class="metric-card"&gt;&lt;span class="number"&gt;3&lt;/span&gt;&lt;span class="label"&gt;&lt;strong&gt;Evidence&lt;/strong&gt;&lt;br&gt;Candidate source documented&lt;/span&gt;&lt;/div&gt;
  &lt;div class="metric-card"&gt;&lt;span class="number"&gt;4&lt;/span&gt;&lt;span class="label"&gt;&lt;strong&gt;Workflow&lt;/strong&gt;&lt;br&gt;Preparation and initial inspection&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;

The wording can improve. The direction should already be clear.

???
These are progress expectations based on work covered by Weeks2–10, not a claim every student has achieved them. If a student is behind, identify the specific missing piece and a feasible next action. A literature matrix is useful supporting work but does not replace synthesis prose.

---

class: balanced

# What a usable question and review look like

&lt;div class="card-grid"&gt;
  &lt;div class="info-card accent"&gt;&lt;h3&gt;Research question&lt;/h3&gt;&lt;p&gt;The reader can identify:&lt;/p&gt;&lt;p&gt;&lt;strong&gt;what&lt;/strong&gt; you examine · &lt;strong&gt;for whom/what&lt;/strong&gt; · &lt;strong&gt;where&lt;/strong&gt; · &lt;strong&gt;when&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;div class="info-card"&gt;&lt;h3&gt;Literature review&lt;/h3&gt;&lt;p&gt;The reader sees:&lt;/p&gt;&lt;p&gt;&lt;strong&gt;themes&lt;/strong&gt; · agreements or disagreements · relevant methods · why your question follows&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

Your review should already contain connected writing and verified citations. Continue updating it as the design develops.

???
Do not demand an entirely new literature review now. Students should revise existing Week3–4 work in light of the final question. A modest extension, context comparison, or clarification can be a contribution when supported by the literature.

---

class: balanced

# What we are finalising in the data work

&lt;div class="card-grid"&gt;
  &lt;div class="info-card"&gt;&lt;h3&gt;Quantitative study&lt;/h3&gt;&lt;p&gt;Source, coverage, unit and variables&lt;/p&gt;&lt;p&gt;Meanings, units and missingness&lt;/p&gt;&lt;p&gt;Preparation, joins, exclusions and checks&lt;/p&gt;&lt;p&gt;What the sample can represent&lt;/p&gt;&lt;/div&gt;
  &lt;div class="info-card green"&gt;&lt;h3&gt;Qualitative study&lt;/h3&gt;&lt;p&gt;Evidence-selection logic&lt;/p&gt;&lt;p&gt;Context and source provenance&lt;/p&gt;&lt;p&gt;Ethical handling&lt;/p&gt;&lt;p&gt;Transparent analysis trail&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

???
Data readiness does not mean all issues disappear or every value must be filled. It means the chosen evidence is feasible, documented, inspected and sufficiently prepared to begin the justified analysis. Qualitative final projects are not required to become quantitative.

---

class: balanced

# You can already start the Data and Method sections

&lt;div class="card-grid"&gt;
  &lt;div class="info-card accent"&gt;&lt;h3&gt;Write Data now&lt;/h3&gt;&lt;p&gt;Describe the evidence you selected and the preparation decisions you made.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="info-card"&gt;&lt;h3&gt;Begin Method now&lt;/h3&gt;&lt;p&gt;Explain the design and the analysis your question requires.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

As we learn and apply the next methods, revise the explanation to match what you actually do.

Keep unresolved decisions visible in your working draft.

???
Writing should begin before all computation is complete. Plans are acceptable in a working draft if clearly labelled; the final Method section must report the completed study. Students should not present unperformed analyses as completed results.

---

class: small

# 3. The final paper structure

&lt;div class="paper-map"&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;1 · Introduction&lt;/strong&gt;Problem, question, approach&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;2 · Literature&lt;/strong&gt;Themes and framework&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;3 · Evidence&lt;/strong&gt;Source, scope, preparation&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;4 · Method&lt;/strong&gt;Procedure and justification&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;5 · Results&lt;/strong&gt;Findings that answer the question&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;6 · Discussion&lt;/strong&gt;Meaning and alternatives&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;7 · Conclusion&lt;/strong&gt;Direct answer and contribution&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;8 · Limitations&lt;/strong&gt;Boundary of the answer&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;9 · References&lt;/strong&gt;Verified sources&lt;/div&gt;
&lt;/div&gt;

Add the required AI-use disclosure and reproducible supporting materials.

???
The syllabus permits a combined Data and Methods section. Limitations may form a clearly labelled discussion subsection, and conclusion/discussion can be integrated if all functions remain explicit. Do not grade numbering or rigid placement as if it were the research objective. The syllabus requires these substantive components, not nine equally long chapters.

---

# Introduction and literature review: why the study follows

&lt;div class="dual-section"&gt;
  &lt;div class="dual-panel"&gt;
    &lt;h2&gt;Introduction · orient&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;Define the problem and why it matters.&lt;/li&gt;
      &lt;li&gt;State the specific research question.&lt;/li&gt;
      &lt;li&gt;Preview the approach.&lt;/li&gt;
      &lt;li&gt;Once known, state the main answer and contribution.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
  &lt;div class="dual-panel alt"&gt;
    &lt;h2&gt;Literature · position&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;Organise scholarship through themes and connections.&lt;/li&gt;
      &lt;li&gt;Show what is established or debated.&lt;/li&gt;
      &lt;li&gt;Explain how concepts and methods inform the design.&lt;/li&gt;
      &lt;li&gt;Define the limited issue your study examines.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="takeaway"&gt;Start both now. Finalise the introduction after analysis, and use original, verified sources throughout.&lt;/div&gt;

???
Writing order differs from reading order. Students should begin the motivation now but not invent findings. The final introduction must match the actual sample, method and conclusion. The literature gap is relative to reviewed evidence; a carefully defined remaining question is more defensible than an unsupported claim that no research exists.

---

# Data and method: what you studied and what you did

&lt;div class="dual-section"&gt;
  &lt;div class="dual-panel"&gt;
    &lt;h2&gt;Data / evidence · document&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;Source, selection, coverage, and period&lt;/li&gt;
      &lt;li&gt;Variables or materials and definitions&lt;/li&gt;
      &lt;li&gt;Preparation, missingness, and exclusions&lt;/li&gt;
      &lt;li&gt;Access, ethical, and representativeness limits&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
  &lt;div class="dual-panel alt"&gt;
    &lt;h2&gt;Method · justify&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;Describe the steps connecting evidence to the answer.&lt;/li&gt;
      &lt;li&gt;Define comparisons, variables, assumptions, or coding.&lt;/li&gt;
      &lt;li&gt;Explain why the procedure fits the question.&lt;/li&gt;
      &lt;li&gt;Report what you actually did—not every available method.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="takeaway"&gt;A small evidence overview can help. Choose methods because they fit the question—not because software offers them.&lt;/div&gt;

???
Quantitative projects should report counts, units, definitions, provenance, and suitable analytical choices. Qualitative projects should document cases or materials, selection, context, ethics, and a defensible analysis trail. Regression, prediction, and mixed methods are not automatic requirements. No compulsory table count is introduced.

---

class: balanced

# Results: show the evidence and explain it

&lt;div class="flow"&gt;
  &lt;div class="flow-step"&gt;&lt;strong&gt;1 · Orient&lt;/strong&gt;State what the reader is seeing&lt;/div&gt;
  &lt;div class="flow-arrow"&gt;→&lt;/div&gt;
  &lt;div class="flow-step"&gt;&lt;strong&gt;2 · Identify&lt;/strong&gt;Name the relevant pattern or result&lt;/div&gt;
  &lt;div class="flow-arrow"&gt;→&lt;/div&gt;
  &lt;div class="flow-step"&gt;&lt;strong&gt;3 · Interpret&lt;/strong&gt;Explain its substantive meaning&lt;/div&gt;
&lt;/div&gt;

Use actual output. A plot or software screenshot without explanation leaves the result unfinished.

???
A full statistical output dump is not necessary. Select meaningful quantities, comparisons and qualitative extracts. If inferential methods are used, explain uncertainty as taught. No pressure to manufacture significance or a positive finding.

---

class: small

# Discussion and conclusion have different jobs

&lt;div class="compare-grid"&gt;
  &lt;div class="compare-card"&gt;&lt;h3&gt;Discussion · interpret&lt;/h3&gt;&lt;p&gt;Connect findings to the question and literature.&lt;/p&gt;&lt;p&gt;Examine explanations and alternatives.&lt;/p&gt;&lt;p&gt;Consider implications in proportion to the evidence.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="compare-card" style="border-top-color:#136f63;"&gt;&lt;h3&gt;Conclusion · answer&lt;/h3&gt;&lt;p&gt;Give the direct, concise answer.&lt;/p&gt;&lt;p&gt;State the contribution and main boundary.&lt;/p&gt;&lt;p&gt;End with the key takeaway or justified next step.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

Both sections should follow from the results already presented.

???
They may be separate or explicitly integrated. Avoid merely repeating results in both places. Implications should be proportionate: an exploratory association is not sufficient to prove a policy will work. No new unsupported results should first appear in the conclusion.

---

class: balanced

# Limitations: explain the boundary of the answer

&lt;div class="flow"&gt;
  &lt;div class="flow-step"&gt;&lt;strong&gt;Name&lt;/strong&gt;What is the limitation?&lt;/div&gt;
  &lt;div class="flow-arrow"&gt;→&lt;/div&gt;
  &lt;div class="flow-step"&gt;&lt;strong&gt;Explain&lt;/strong&gt;What consequence does it have?&lt;/div&gt;
  &lt;div class="flow-arrow"&gt;→&lt;/div&gt;
  &lt;div class="flow-step"&gt;&lt;strong&gt;Respond&lt;/strong&gt;How did you handle it?&lt;/div&gt;
&lt;/div&gt;

Example:

&gt; “The records describe regional averages. They cannot establish whether the same relationship holds for individual residents.”

Other limits can involve selection, measurement, missingness, time coverage, interpretation or causal identification.

???
The example is a statement about a possible design, not an empirical result. Avoid generic lists such as small sample, time, money unless linked to the inference. Honest limitations strengthen the credibility of a modest project.

---

class: small

# A small project can still form a complete study

&lt;div class="mini-label"&gt;Illustrative design&lt;/div&gt;

&lt;div class="question-chain"&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Question&lt;/strong&gt;How did internet use change in Korea and Vietnam, 2000–2023?&lt;/div&gt;&lt;div class="chain-arrow"&gt;→&lt;/div&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Literature&lt;/strong&gt;Digital access and its measurement&lt;/div&gt;&lt;div class="chain-arrow"&gt;→&lt;/div&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Data + method&lt;/strong&gt;Annual indicators, trends, endpoint comparisons&lt;/div&gt;&lt;div class="chain-arrow"&gt;→&lt;/div&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Meaning&lt;/strong&gt;Contextualise patterns; keep claims descriptive&lt;/div&gt;
&lt;/div&gt;

???
This illustrates alignment, not a ready-made final paper or a claim that two trend lines alone deserve a high grade. The student must supply literature, actual checked results, justification and interpretation. If the question requires explanation rather than description, evidence/design must be strengthened or the question narrowed.

---

class: small

# 4. How the next weeks build your paper

&lt;div class="timeline"&gt;
  &lt;div class="timeline-item current"&gt;&lt;strong&gt;Week 10&lt;/strong&gt;&lt;span&gt;PREPARE&lt;/span&gt;&lt;br&gt;Data section and initial outputs&lt;/div&gt;
  &lt;div class="timeline-item"&gt;&lt;strong&gt;Week 11&lt;/strong&gt;&lt;span&gt;COMPARE&lt;/span&gt;&lt;br&gt;Method choices and first results&lt;/div&gt;
  &lt;div class="timeline-item"&gt;&lt;strong&gt;Week 12&lt;/strong&gt;&lt;span&gt;ANALYSE&lt;/span&gt;&lt;br&gt;Appropriate analysis and interpretation&lt;/div&gt;
  &lt;div class="timeline-item"&gt;&lt;strong&gt;Week 13&lt;/strong&gt;&lt;span&gt;CHECK&lt;/span&gt;&lt;br&gt;Refined method and claim boundaries&lt;/div&gt;
  &lt;div class="timeline-item"&gt;&lt;strong&gt;Week 14&lt;/strong&gt;&lt;span&gt;CONNECT&lt;/span&gt;&lt;br&gt;One complete, coherent draft&lt;/div&gt;
&lt;/div&gt;

Use the approaches relevant to your question.

???
Matches the final syllabus. Week 11 is specifically bivariate analysis and inference, not a promise of all computational methods at once. Week 12 regression is a research tool; it is not mandatory for every final project. Relevant work already begun can proceed earlier.

---

# From working sections to the Week 14 composite draft

&lt;div class="flow"&gt;
  &lt;div class="flow-step"&gt;&lt;strong&gt;Now&lt;/strong&gt;Question · review · evidence · method&lt;/div&gt;
  &lt;div class="flow-arrow"&gt;→&lt;/div&gt;
  &lt;div class="flow-step"&gt;&lt;strong&gt;After analysis&lt;/strong&gt;Results · discussion · limitations&lt;/div&gt;
  &lt;div class="flow-arrow"&gt;→&lt;/div&gt;
  &lt;div class="flow-step"&gt;&lt;strong&gt;Week 14&lt;/strong&gt;Connect every section into one paper&lt;/div&gt;
&lt;/div&gt;

&lt;div class="check-grid"&gt;
  &lt;div class="check-item"&gt;Question, literature, evidence, and method align&lt;/div&gt;
  &lt;div class="check-item"&gt;Results answer the question&lt;/div&gt;
  &lt;div class="check-item"&gt;Discussion and conclusion follow from results&lt;/div&gt;
  &lt;div class="check-item"&gt;Citations, definitions, and supporting files agree&lt;/div&gt;
&lt;/div&gt;

???
The paper begins with an introduction even if its final version is written later. By the end of Week 13, students should have Data, Method, and Results drafts. Week 14 connects substantive content into one paper; it is more than pasting assignments together. Unresolved issues may be labelled, but empty headings do not form a full draft. Exact logistics follow CyberCampus.

---

# 5. Presentation, final submission, and what matters

&lt;div class="takeaway"&gt;The &lt;strong&gt;35% final examination assignment&lt;/strong&gt; combines your individual paper, reproducible supporting materials, and complete-study presentation.&lt;/div&gt;

&lt;div class="card-grid"&gt;
  &lt;div class="info-card accent"&gt;&lt;h3&gt;Weeks 15–16&lt;/h3&gt;&lt;p&gt;Present the complete research argument and answer immediate questions.&lt;/p&gt;&lt;p&gt;Use feedback to revise before the Week 16 submission.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="info-card green"&gt;&lt;h3&gt;What matters&lt;/h3&gt;&lt;p&gt;Clear question · feasible scope · relevant literature · fitting evidence and method · accurate interpretation · honest limitations&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="artifact"&gt;&lt;strong&gt;Remember:&lt;/strong&gt; a simple, well-justified study can demonstrate all of these qualities.&lt;/div&gt;

???
The final-project component is 35%; no new subweights or presentation duration are introduced. Presentations are individual, with immediate Q&amp;A. This is qualitative assessment guidance, not a new weighted rubric or publication standard. Students should be able to explain their reasoning and any code-assisted work. Follow the posted schedule and submission instructions.

---

class: balanced

# Your next steps and our progress conversation

**For your current project:**

1. State the working question and point to your review draft.
2. Explain what evidence is ready and what remains unresolved.
3. Identify the next analysis decision and the section you can write now.

Bring specific obstacles to class or office hours: **Tue/Thu 15:00–16:30; Wed 10:00–12:00**, or by appointment.

???
Allow 5 minutes for students to check their own materials and for two or three brief questions. This is a progress conversation, not an extra graded assignment or exit ticket. With12students, individual follow-up can continue during studio circulation. Published announcements/deadlines remain on Cyber Campus. Officehours follow the instructor’s confirmed schedule.

---

class: balanced

# Appendix: a section-by-section completion check

Use the following slides while drafting and revising.

They explain what a reader should learn from each section and what supporting materials should make visible.

You do not need to make every section equally long. Give each section enough space to do its job.

???
Reference material; do not read every appendix slide during the briefing. The aim is a complete but manageable study, with substance rather than filler.

---

class: small

# The working paper checklist

&lt;div class="paper-map"&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;Introduction&lt;/strong&gt;Problem · question · motivation · approach&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;Literature&lt;/strong&gt;Themes · verified citations · rationale&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;Data / evidence&lt;/strong&gt;Source · selection · definitions · preparation&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;Method&lt;/strong&gt;Procedure · justification · current status&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;Results&lt;/strong&gt;Checked findings · explained outputs&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;Discussion&lt;/strong&gt;Literature · interpretation · alternatives&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;Conclusion&lt;/strong&gt;Direct answer · contribution&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;Limitations&lt;/strong&gt;Specific, consequential boundaries&lt;/div&gt;
  &lt;div class="paper-node"&gt;&lt;strong&gt;Supporting work&lt;/strong&gt;References · disclosure · reproducibility&lt;/div&gt;
&lt;/div&gt;

By the final submission, replace plans with an account of completed work.

???
This is a drafting aid, not a claim that planned results can substitute for final results. Section headings can be combined if their functions remain visible. References, disclosure and supporting materials remain required.

---

class: balanced

# A project map for checking alignment

&lt;div class="question-chain"&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Question&lt;/strong&gt;My question is …&lt;/div&gt;&lt;div class="chain-arrow"&gt;→&lt;/div&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Literature&lt;/strong&gt;helps me understand …&lt;/div&gt;&lt;div class="chain-arrow"&gt;→&lt;/div&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Evidence&lt;/strong&gt;covers …&lt;/div&gt;&lt;div class="chain-arrow"&gt;→&lt;/div&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Method&lt;/strong&gt;can show …&lt;/div&gt;&lt;div class="chain-arrow"&gt;→&lt;/div&gt;
  &lt;div class="chain-item"&gt;&lt;strong&gt;Answer&lt;/strong&gt;is limited by …&lt;/div&gt;
&lt;/div&gt;

Before analysis, leave the result unresolved rather than inventing an answer.

???
Optional self-check template rather than a new submission. If students cannot connect the statements, identify where a source, method or question needs changing.

---

class: small

# Common obstacles and feasible responses

&lt;div class="card-grid"&gt;
  &lt;div class="info-card accent"&gt;&lt;h3&gt;Topic too broad&lt;/h3&gt;&lt;p&gt;Narrow the population, period, setting, or relationship.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="info-card"&gt;&lt;h3&gt;Data do not fit&lt;/h3&gt;&lt;p&gt;Find a justified measure—or revise the question.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="info-card orange"&gt;&lt;h3&gt;Method too advanced&lt;/h3&gt;&lt;p&gt;Use a simpler approach that still answers a useful question.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="info-card green"&gt;&lt;h3&gt;Results unexpected&lt;/h3&gt;&lt;p&gt;Verify the workflow and report the evidence honestly.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="takeaway"&gt;&lt;strong&gt;Review reads like a list?&lt;/strong&gt; Reorganise it around themes that inform your design.&lt;/div&gt;

Discuss major changes early enough to keep the project feasible.

???
A lack of statistical significance is not failure. Differentiate weak evidence from invalid code. Data access obstacles should lead to a revised feasible plan rather than waiting until Week 14. Do not promise an unavailable source or invent data.

---

class: balanced

# Supporting materials and reproducibility

Provide a clear starting point and a way to follow your work.

Include, as relevant:

- source log, variable or coding definitions, and permissions notes
- preparation and analysis notebooks/scripts or a qualitative audit trail
- the figures, tables or deidentified extracts used in the paper
- a short README explaining files and how to reproduce outputs

Preserve raw evidence where sharing and licensing permit.

???
Follow syllabus reproducibility requirement. Sensitive or restricted data should not be uploaded to a public repository. When sharing is restricted, document approved access/reconstruction and share permissible code/materials. Reproducibility for qualitative work involves traceable interpretation and documentation, not necessarily identical automated outputs.

---

class: balanced

# Writing tools and references

Use **MS Word or Overleaf**, whichever helps you write and revise clearly.

Use **Zotero or another reference manager** to organise citations and references.

Check that:

- every cited source appears in the reference list
- quotations, paraphrases, data and borrowed figures have attribution
- tables and figures have clear labels and are discussed in the text
- the final formatting follows the posted instructions

???
No requirement to change writing software or learn LaTeX. Overleaf is optional. Reference managers need human checking. Avoid introducing a new citation-style, page or word limit that the instructor has not approved.

---

# Responsibility and the final Week 14 check

&lt;div class="dual-section"&gt;
  &lt;div class="dual-panel"&gt;
    &lt;h2&gt;AI responsibility&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;Disclose the help used and how you checked it.&lt;/li&gt;
      &lt;li&gt;Verify sources, code, measures, and every reported finding.&lt;/li&gt;
      &lt;li&gt;Be ready to explain the study in presentation and Q&amp;A.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
  &lt;div class="dual-panel alt"&gt;
    &lt;h2&gt;Draft responsibility&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;Follow one question from beginning to end.&lt;/li&gt;
      &lt;li&gt;Give every section meaningful content.&lt;/li&gt;
      &lt;li&gt;Trace findings to evidence and analysis.&lt;/li&gt;
      &lt;li&gt;Make introduction and conclusion match the completed study.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="takeaway"&gt;&lt;strong&gt;Bring the connected draft and supporting materials.&lt;/strong&gt; Fabricated references, data, or results are unacceptable.&lt;/div&gt;

???
This is a reminder of existing requirements, not a new AI permission. Keep disclosure brief but specific and retain the verification record. Course basis: TIC3002 final syllabus and Week 14 workshop plan. Exact dates, formats, and submission channels follow CyberCampus. The expected product is a small, complete undergraduate study—not a publication-ready article.
