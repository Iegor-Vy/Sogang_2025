Two researchers download the same source. One fills blanks with zero; the other omits those observations. Could they report different averages? Why?

???

&lt;div class="compare-grid"&gt;
  &lt;div class="compare-card" style="text-align:center;"&gt;&lt;h3&gt;One ↔ One&lt;/h3&gt;&lt;div style="font-size:32px; margin:15px;"&gt;● ─── ●&lt;/div&gt;GDP country-years + life-expectancy country-years&lt;br&gt;&lt;br&gt;&lt;code&gt;one_to_one&lt;/code&gt;&lt;/div&gt;

&lt;/div&gt;

&lt;div class="caution"&gt;Use the full key and inspect row counts and unmatched records. A matched key can still contain a missing measurement.&lt;/div&gt;

???
3 minutes. Inner joins keep keys shared by both tables; left joins retain left-table keys; outer joins retain either. These control key coverage. They do not establish that measurement values are available. Show the validated outer join in the notebook.

# A short join that documents expectations

```python
joined = gdp.merge(
    life,
    on=["country_code", "year"],
    how="outer",
    validate="one_to_one",
    indicator=True
)
```

Check `_merge`, unique keys, row count, and missing values after the join.

???
2 minutes. The correct all-country join has 648 country-years. All supplied keys match, but GDP still has 48 missing measurements. Tidy and joins block: 3 + 3 + 3 + 4 + 2 = 15 minutes.
