# Week 12: Regression as a research method

**Tuesday:** specification, interpretation and evidence

**Thursday:** a guided regression and prediction lab


&lt;div class="student-note"&gt;Regression is useful only when the specification, evidence, and claim all answer the same research question.&lt;/div&gt;

???

Opening, 1 minute. This week connects the earlier inference refresher to research specifications and prediction. Two 75-minute meetings. The appendix and notebook section 9 are optional. Students need a coherent, modest individual study, rather than a sophisticated model for its own sake.

---

# Agenda

**Tuesday - Meeting 1**

1. Turn a research question into a regression comparison

2. Understand what changes when controls are added

3. Check patterns the model did not explain

4. Compare prediction methods on new records

5. Connect the lesson to your own project

Appendix: optional advanced models and software references.

&lt;div class="student-note"&gt;The lesson starts with a question, builds a model, checks its weaknesses, and then asks whether it predicts new cases well.&lt;/div&gt;

???

1 minute. Preview the full narrative. Each agenda item receives a matching section and example. Preserve the distinction between a description, an adjusted association, causal explanation, and prediction throughout.

---

# What do we want a model to answer?

**Question A:** How is vehicle weight associated with fuel economy, accounting for recorded characteristics?

**Question B:** How accurately can those characteristics predict fuel economy for similar records?

**Think, then discuss with a neighbour:** What evidence would count as success for each question?

&lt;div class="student-note"&gt;&lt;strong&gt;Explanatory aim:&lt;/strong&gt; interpret a defined comparison. &lt;strong&gt;Predictive aim:&lt;/strong&gt; estimate outcomes accurately for similar unseen records.&lt;/div&gt;

???

3 minutes. Think individually for 30 seconds, discuss with a neighbour for 1 minute, then debrief for 90 seconds. Question A needs a defined comparison, uncertainty, and a design argument. Question B needs a defensible validation procedure and useful error metric. Causality would require additional identification.

# 1. From a research question to a regression line

&lt;div class="section-subtitle"&gt;We begin with the outcome and comparison, then use OLS to draw the straight line that best summarizes the observed pattern.&lt;/div&gt;

???

Section transition. This time is included in the next content block.

class: small

# One real dataset, two research aims

**Auto MPG:** 398 historical vehicle records, model years 1970–1982.

| Variable | Meaning |
|---|---|
| MPG | City-cycle miles per gallon |
| Weight | Pounds, divided by 1,000 in our OLS model |
| Horsepower | Engine characteristic, six values missing |
| Model year and origin | Time code and categorical origin code |

Source: UCI Auto MPG, DOI **10.24432/C5859H**, CC BY 4.0.

&lt;div class="student-note"&gt;&lt;strong&gt;Reading the outcome:&lt;/strong&gt; higher MPG means a vehicle travels farther per gallon and therefore has better measured fuel economy.&lt;/div&gt;

???

3 minutes. UCI supplies the revised StatLib records. It already removed eight records with unknown MPG and retains six missing horsepower values. The ISLR2 authors document weight in pounds. The rows are observational historical records, not randomized weight assignments or a representative sample of modern vehicles.

---

# Where the 398 vehicles go

&lt;div class="sample-total"&gt;&lt;strong&gt;398 vehicles&lt;/strong&gt;Full historical dataset&lt;/div&gt;

&lt;div class="sample-split"&gt;
  &lt;div class="sample-group"&gt;
    &lt;h2&gt;298 training vehicles&lt;/h2&gt;
    &lt;p&gt;We use these records to &lt;strong&gt;build, inspect, and choose&lt;/strong&gt; models.&lt;/p&gt;
    &lt;p class="plain-detail"&gt;&lt;strong&gt;Why does OLS use 294?&lt;/strong&gt;&lt;br&gt;Four training vehicles have no horsepower value, so the explanatory OLS examples leave them out.&lt;/p&gt;
    &lt;p class="plain-detail"&gt;&lt;strong&gt;Prediction models use all 298.&lt;/strong&gt;&lt;br&gt;They fill missing horsepower using information learned from training data.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="sample-group test"&gt;
    &lt;h2&gt;100 test vehicles&lt;/h2&gt;
    &lt;p&gt;We keep these records aside while developing the models.&lt;/p&gt;
    &lt;p class="plain-detail"&gt;We use them &lt;strong&gt;once at the end&lt;/strong&gt; to check prediction on unseen records.&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="result-band"&gt;&lt;strong&gt;Why split the data?&lt;/strong&gt; The untouched test set gives a more honest check of how the chosen model predicts new records.&lt;/div&gt;

???

2 minutes. The random split uses seed 1201 and occurs before plotting. The same 294 complete training rows enter all three explanatory OLS models. All predictive candidates use 298 training records and the same 100 test records. Treat exploratory specification checks and nominal intervals honestly rather than claiming confirmatory inference after a search.

---

# OLS draws the best-fitting straight line

**Question:** how does average MPG differ as vehicle weight changes?

**OLS** stands for *ordinary least squares*. It chooses the straight line that makes the overall prediction mistakes as small as possible.

&lt;div class="split"&gt;
  &lt;div class="split-panel"&gt;&lt;h2&gt;Fitted value&lt;/h2&gt;&lt;p&gt;The MPG predicted by the line for one vehicle.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="split-panel alt"&gt;&lt;h2&gt;Residual&lt;/h2&gt;&lt;p&gt;Actual MPG minus predicted MPG. It is the vertical gap from a point to the line.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="student-note"&gt;&lt;strong&gt;Weight unit:&lt;/strong&gt; the model records weight in 1,000 lb, so a change of 0.5 means 500 lb.&lt;/div&gt;

???

3 minutes. Distinguish an unobserved model error from a fitted residual. The intercept is the fitted value at zero weight, outside observed support. OLS can be understood as a best linear approximation without assuming the true relationship is exactly linear. Matrix derivations are outside the core.

# Adding controls changes the question

**Simple model:** compare MPG across vehicle weights.

**Adjusted model:** compare vehicle weights while also accounting for recorded horsepower, model year, and origin.

&lt;div class="split"&gt;
  &lt;div class="split-panel"&gt;&lt;h2&gt;What “holding fixed” means&lt;/h2&gt;&lt;p&gt;The model compares vehicles at the same recorded values of the included controls.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="split-panel alt"&gt;&lt;h2&gt;What it does not mean&lt;/h2&gt;&lt;p&gt;The vehicles are not identical, and adding controls does not automatically create a causal comparison.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="student-note"&gt;The technical name for the chosen variables and equation is the &lt;strong&gt;model specification&lt;/strong&gt;.&lt;/div&gt;

???

3 minutes. Explain the formula syntax. C(origin) creates category indicators with code 1 as reference. The additive specification assumes common slopes across origin categories. Conditioning on recorded variables does not create identical cars or randomized comparisons. Control selection needs a research argument because mediators and colliders can create problems.

# Adjustment changes the interpretation

&lt;div class="plot"&gt;&lt;img src="assets/weight_specification_comparison.png" alt="Simple and adjusted OLS weight slopes" /&gt;&lt;/div&gt;

.caption[Both estimates use the same 294 records. The adjusted model also includes horsepower, model year, and origin.]

The adjusted association is less negative because it answers a different comparison. This change does not reveal how much causal bias was removed without additional assumptions.

&lt;div class="student-note"&gt;The simple and adjusted slopes differ because they summarize different comparisons, not because one coefficient is automatically the truth.&lt;/div&gt;

???

1 minute. Keeping the sample fixed isolates a change in specification rather than a change in rows. Joint decisions about engine size, horsepower, and weight can complicate conditional interpretation. We cannot infer the amount of causal bias removed from this coefficient comparison.

# Uncertainty and fit answer different questions

**Coefficient interval:** how uncertain is the estimated conditional slope under the model?

**R²:** how much training variation does the fitted model account for?

**Prediction error:** for vehicles that were **not used to build the model**, compare the predicted MPG with the actual MPG.

&lt;div class="definition"&gt;&lt;strong&gt;Example:&lt;/strong&gt; the model predicts 28 MPG, but the vehicle actually has 25 MPG. The prediction misses by &lt;strong&gt;3 MPG&lt;/strong&gt;.&lt;/div&gt;

A high R² cannot validate the causal interpretation or guarantee useful predictions.

&lt;div class="student-note"&gt;&lt;strong&gt;“Held out” means kept aside.&lt;/strong&gt; The 100 test vehicles were not used to choose or fit the model. Smaller prediction errors on these records indicate better prediction for similar unseen vehicles.&lt;/div&gt;

???

2 minutes. Define a prediction error for one record as observed outcome minus predicted outcome; its sign shows the direction of the miss, while its absolute size shows how far the prediction missed. Later, MAE averages absolute errors and RMSE gives more weight to larger errors. Training R², coefficient uncertainty, and test prediction error concern different targets. Normality of X or Y is not an OLS requirement. Exact classical finite-sample inference requires stronger assumptions than approximate HC3 inference.

# 3. Checking model problems and research limits

&lt;div class="section-subtitle"&gt;Model checks show patterns left unexplained. Research design determines whether the final claim is descriptive, associational, predictive, or causal.&lt;/div&gt;

???

Section transition. This time is included in the next content block.

class: small

# Model checks ask what the regression missed

| Check | Plain-language question |
|---|---|
| Residuals versus predictions | Do the mistakes form a pattern instead of a random cloud? |
| Q-Q plot of residuals | Are there unusually large mistakes in the tails? |
| Unusual predictor values (leverage) | Is a vehicle far from most others in its recorded characteristics? |
| Influence (Cook's distance) | Does one vehicle noticeably change the fitted model? |
| Data and design documentation | Could selection, missing data, or related records affect the claim? |

&lt;div class="student-note"&gt;A warning sign tells us what to investigate. No single graph gives the entire regression a pass or fail.&lt;/div&gt;

???

2 minutes. A residual pattern can signal omitted curvature, changing variance, or other misspecification. A Q–Q departure does not by itself invalidate every OLS estimate. Leverage concerns unusual predictors, while influence concerns how a record changes the fitted model. No diagnostic plot proves exogeneity.

# A curved model has no single weight effect

&lt;div class="split"&gt;
  &lt;div class="split-panel"&gt;
    &lt;h2&gt;Straight-line model&lt;/h2&gt;
    &lt;p&gt;Uses one weight slope for every vehicle. An additional 1,000 lb has the same fitted MPG difference across the entire graph.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="split-panel alt"&gt;
    &lt;h2&gt;Curved model&lt;/h2&gt;
    &lt;p&gt;The fitted MPG difference depends on the starting weight. We therefore report the slope at a specific weight.&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="result-band"&gt;&lt;strong&gt;Near 3,000 lb:&lt;/strong&gt; an additional 1,000 lb is associated with about &lt;strong&gt;6.50 fewer MPG&lt;/strong&gt;, after accounting for horsepower, model year, and origin.&lt;/div&gt;

&lt;div class="student-note"&gt;&lt;strong&gt;“Local slope” means near that weight.&lt;/strong&gt; It should not be presented as one universal effect for every light and heavy vehicle.&lt;/div&gt;

???

2 minutes. This is a local derivative, not the exact change for a full 1,000 lb jump. For a finite change, compare predictions at the two values. Retain the linear term when adding its square. Centering makes the interpretation clearer but does not remove all collinearity.

# HC3 gives safer uncertainty when the scatter is uneven

Regression mistakes may be tightly grouped for some vehicles and widely spread for others. Ordinary standard errors can then be too optimistic.

&lt;div class="split"&gt;
  &lt;div class="split-panel"&gt;
    &lt;h2&gt;What stays the same&lt;/h2&gt;
    &lt;p&gt;The coefficient estimates and the fitted regression line or curve.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class="split-panel alt"&gt;
    &lt;h2&gt;What HC3 recalculates&lt;/h2&gt;
    &lt;p&gt;Standard errors, confidence intervals, t-statistics, and p-values.&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="caution"&gt;&lt;strong&gt;HC3 cannot fix the research design.&lt;/strong&gt; It does not solve missing important variables, reverse causality, related observations, or the wrong curve.&lt;/div&gt;

&lt;div class="student-note"&gt;Think of HC3 as a more cautious way to report uncertainty when the residual plot has uneven spread.&lt;/div&gt;

???

2 minutes. HC3 is a leverage-adjusted heteroskedasticity-consistent covariance estimator. It leaves OLS coefficients unchanged. It does not accommodate arbitrary within-manufacturer dependence, serial correlation, or endogeneity. Repeated country-year records need a design that respects dependence.

---

class: small

# Regression can mislead for reasons beyond the equation

| Possible problem | Why it matters |
|---|---|
| Important factor is missing | Weight may stand in for another vehicle characteristic that also affects MPG |
| Measurement is imperfect | Recorded horsepower or MPG may not fully represent the concept of interest |
| Available records are selected | Historical vehicles may differ from modern vehicles or the population we want to discuss |
| Some records are related | Similar models from one manufacturer may not provide fully independent evidence |
| The line has the wrong shape | A straight line may hide curvature or other patterns |

&lt;div class="student-note"&gt;Better software cannot remove these problems automatically. Researchers must use subject knowledge, documentation, and careful claims.&lt;/div&gt;

???

2 minutes. Ask students which threat is most relevant to their project. For Auto MPG, consider unrecorded fuel type, selected historical vehicles, missing horsepower, related model families, and curvature. HC3 and regularization do not remove these threats. Even perfect residual plots cannot prove that omitted factors are unrelated to X.

# A sensitivity check asks whether one record drives the result

At 3,000 lb, the curved model gives:

| Analysis | Estimated local slope |
|---|---:|
| Use all 294 training vehicles | -6.50 MPG per 1,000 lb |
| Temporarily leave out the most influential vehicle | -6.59 MPG per 1,000 lb |

The estimate changes very little, so this one vehicle does not drive the result.

&lt;div class="student-note"&gt;This answers one narrow question about sensitivity to one record. It does not prove that the model, sample, or causal interpretation is correct.&lt;/div&gt;

???

2 minutes. The full-model local slope is -6.50 with HC3 interval about -7.38 to -5.61. Leaving out the largest Cook-distance record gives -6.59 with interval about -7.47 to -5.72. Keep the valid record in the main result and display the sensitivity result. Stability to one record does not establish general validity.

# 4. Predicting new vehicles

&lt;div class="section-subtitle"&gt;Prediction asks how close the model comes to actual MPG for vehicles that were not used to build or tune it.&lt;/div&gt;

???

Section transition. This time is included in the next content block.

# A model can learn the training data too closely

Weight, engine size, cylinder count, and horsepower are related.

Adding many squared terms and combinations makes the model more flexible. It can then learn small quirks of the training records instead of a pattern that repeats.

&lt;div class="definition"&gt;&lt;strong&gt;Overfitting:&lt;/strong&gt; very good performance on the training data but weaker prediction for new records.&lt;/div&gt;

&lt;div class="student-note"&gt;&lt;strong&gt;Regularization&lt;/strong&gt; is a method that limits extreme complexity so predictions can be more stable.&lt;/div&gt;

???

2 minutes. Six numerical predictors expanded to degree two produce 27 numerical features, plus two origin indicators. All observations remain real. More flexibility can lower training error while worsening generalization. Regularization may help but does not guarantee better test accuracy.

---

# Regression models answer different prediction needs

&lt;div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:8px;"&gt;
  &lt;div style="border-top:4px solid #941b0c;background:#f7f4f3;padding:10px 14px;"&gt;
    &lt;h3 style="margin:0 0 5px;color:#941b0c;"&gt;Linear OLS&lt;/h3&gt;
    &lt;svg viewBox="0 0 220 70" style="width:46%;float:right;margin-left:10px;"&gt;&lt;circle cx="25" cy="52" r="4" fill="#3b7c8f"/&gt;&lt;circle cx="60" cy="45" r="4" fill="#3b7c8f"/&gt;&lt;circle cx="100" cy="36" r="4" fill="#3b7c8f"/&gt;&lt;circle cx="145" cy="27" r="4" fill="#3b7c8f"/&gt;&lt;circle cx="190" cy="17" r="4" fill="#3b7c8f"/&gt;&lt;line x1="15" y1="57" x2="205" y2="12" stroke="#941b0c" stroke-width="4"/&gt;&lt;/svg&gt;
    &lt;p&gt;&lt;strong&gt;Fits one straight relationship.&lt;/strong&gt;&lt;br&gt;Use it when a straight-line summary is reasonable and interpretation matters.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div style="border-top:4px solid #3b7c8f;background:#f2f6f7;padding:10px 14px;"&gt;
    &lt;h3 style="margin:0 0 5px;color:#2d6677;"&gt;Polynomial regression&lt;/h3&gt;
    &lt;svg viewBox="0 0 220 70" style="width:46%;float:right;margin-left:10px;"&gt;&lt;circle cx="25" cy="50" r="4" fill="#941b0c"/&gt;&lt;circle cx="65" cy="34" r="4" fill="#941b0c"/&gt;&lt;circle cx="105" cy="23" r="4" fill="#941b0c"/&gt;&lt;circle cx="150" cy="25" r="4" fill="#941b0c"/&gt;&lt;circle cx="195" cy="44" r="4" fill="#941b0c"/&gt;&lt;path d="M15 57 Q110 5 207 52" fill="none" stroke="#3b7c8f" stroke-width="4"/&gt;&lt;/svg&gt;
    &lt;p&gt;&lt;strong&gt;Allows a curve.&lt;/strong&gt;&lt;br&gt;Use it when the outcome changes differently at low and high predictor values.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div style="border-top:4px solid #3b7c8f;background:#f2f6f7;padding:10px 14px;"&gt;
    &lt;h3 style="margin:0 0 5px;color:#2d6677;"&gt;Ridge regression&lt;/h3&gt;
    &lt;p&gt;&lt;strong&gt;Keeps all predictors but reduces extreme coefficients.&lt;/strong&gt;&lt;br&gt;Useful when predictors overlap, such as weight, cylinders, and engine size.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div style="border-top:4px solid #5c8d52;background:#f4f7f2;padding:10px 14px;"&gt;
    &lt;h3 style="margin:0 0 5px;color:#476f40;"&gt;Lasso regression&lt;/h3&gt;
    &lt;p&gt;&lt;strong&gt;Can reduce some coefficients to zero.&lt;/strong&gt;&lt;br&gt;Useful when we want a smaller prediction formula from many possible features.&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class="student-note"&gt;&lt;strong&gt;In this lecture:&lt;/strong&gt; OLS supports interpretation. Polynomial OLS checks curvature. Ridge and Lasso focus on prediction for new vehicles.&lt;/div&gt;

???

4 minutes. These models share the same basic aim of linking predictors to an outcome, but they make different choices about shape and complexity. The polynomial model is still OLS with extra transformed predictors. Ridge and Lasso add a penalty and require the penalty strength to be chosen using training data.

---

class: small

# How Ridge and Lasso control complexity

| Method | Plain-language idea | What students should remember |
|---|---|---|
| OLS | Fits the training data without a penalty | Clear baseline, but flexible versions may overfit |
| Ridge | Pulls large coefficients toward zero | Often stabilizes prediction when predictors overlap |
| Lasso | Pulls coefficients toward zero and can set some exactly to zero | Produces a simpler selected set of features |

&lt;div class="student-note"&gt;Ridge and Lasso need predictors on comparable scales. Their selected coefficients support prediction, not automatic causal importance.&lt;/div&gt;

???

3 minutes. Ridge and Lasso use different objective normalizations in scikit-learn, so their alpha values are not directly comparable. The intercept is unpenalized. Scaling belongs inside training folds. A zero Lasso coefficient does not prove that a construct is scientifically irrelevant. We report no ordinary post-selection p-values for Lasso.

---

# Choose the model without looking at the final test answers

&lt;div class="plain-steps"&gt;
  &lt;div class="plain-step"&gt;Keep 100 test vehicles aside.&lt;/div&gt;
  &lt;div class="plain-step"&gt;Use only the training vehicles to compare settings through repeated train-and-check splits. This is cross-validation.&lt;/div&gt;
  &lt;div class="plain-step"&gt;Choose one model and fit it using all training vehicles.&lt;/div&gt;
  &lt;div class="plain-step"&gt;Open the test set once for the final prediction check.&lt;/div&gt;
&lt;/div&gt;

&lt;div class="student-note"&gt;All data preparation must be learned separately inside each training split. This prevents &lt;strong&gt;data leakage&lt;/strong&gt;, where the model indirectly sees validation answers.&lt;/div&gt;

???
3 minutes. In five-fold CV, fit four training parts and validate on the fifth, rotating through all five. Each fold learns imputation and scaling from its own training part. Refit the selected pipeline on all training records. A scaler before an internally cross-validated estimator can leak fold information. Future years or unseen manufacturers require different split designs.

---

# Training-data checks choose how strongly Lasso simplifies

&lt;div class="plot"&gt;&lt;img alt="Prediction error across possible Lasso penalty strengths" src="assets/lasso_penalty_plain.png" /&gt;&lt;/div&gt;

&lt;div class="plot-reading"&gt;
  &lt;div class="item"&gt;&lt;h3&gt;Each dot is one choice&lt;/h3&gt;&lt;p&gt;Moving right tells Lasso to simplify the model more strongly by shrinking more coefficients.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="item alt"&gt;&lt;h3&gt;Lower means better prediction&lt;/h3&gt;&lt;p&gt;For each choice, we repeatedly train on part of the training sample and check predictions on the remaining part.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="student-note"&gt;&lt;strong&gt;Decision:&lt;/strong&gt; choose the dot with the lowest average error, then refit Lasso using all 298 training vehicles. The 100 test vehicles remain untouched until the final check.&lt;/div&gt;

???

2 minutes. The actual alpha grid has 16 values from 0.001 to 1. The selected Lasso alpha is about 0.003981. Lasso retains 18 of 29 expanded features. Small differences in training-check error do not establish a universal best model. The next slide compares these training checks with the untouched test sample.

---

class: small

# Training checks versus the final test

&lt;div class="plot compact"&gt;&lt;img alt="Training-check and final-test prediction errors for five regression models" src="assets/training_test_rmse_comparison.png" /&gt;&lt;/div&gt;

&lt;div class="plot-reading"&gt;
  &lt;div class="item"&gt;&lt;h3&gt;Blue bars: training checks&lt;/h3&gt;&lt;p&gt;Each model repeatedly predicts records temporarily set aside from the 298 training vehicles. We use these results to compare models.&lt;/p&gt;&lt;/div&gt;
  &lt;div class="item alt"&gt;&lt;h3&gt;Red bars: final test&lt;/h3&gt;&lt;p&gt;After all choices are fixed, each model predicts the 100 vehicles kept separate from the beginning.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class="student-note"&gt;&lt;strong&gt;Conclusion:&lt;/strong&gt; Ridge and Lasso both have test error near &lt;strong&gt;3.03 MPG&lt;/strong&gt;. Their almost identical bars do not support claiming that one is clearly better. Both predict much better than simply using the average MPG.&lt;/div&gt;

???

4 minutes. Training-check RMSE is 2.79 MPG for Ridge and 2.76 for Lasso. Final-test RMSE is 3.027 for Ridge and 3.028 for Lasso. The small increase from training checks to the test sample is expected. The similar test results suggest that the training comparison was reasonably informative for this split. Lasso remains the preselected model because it had the lowest training-check error; we do not switch to Ridge after seeing the test result.

|---|---|
| Describe an adjusted association | Coefficient or predicted contrast, interval, and model checks |
| Predict new cases | Training/test plan, a simple baseline, prediction errors, and limitations |
| Explain a cause | A credible reason why groups differ in X but not in other causes, plus estimation and uncertainty |
| Understand experiences or meanings | Themes, supporting evidence, interpretation, and trustworthiness |

&lt;div class="student-note"&gt;More controls, more equations, or a higher R-squared do not automatically make a causal claim credible.&lt;/div&gt;

???

3 minutes. Link this choice to the question developed in Week 2, literature from Weeks 3–4, and data documentation. A well-explained descriptive or qualitative project can be appropriate. More controls or a higher R² cannot replace a causal identification argument.

# 1. Source, split and checks — 8 minutes

Run notebook **0–1**.

Confirm **398 source rows**, **298 training rows**, **100 reserved test rows**, and **294 complete OLS training rows**.

Locate the source, missing-value count, measurement units, and origin codes.

# 2. OLS interpretation — 12 minutes

Run notebook **2**.

Read the simple fit and adjusted coefficient table.

Write a sentence for the **500 lb adjusted weight contrast**, with uncertainty and controls.

**Pair check:** Underline the outcome unit, comparison, and claim boundary. Compare your sentence with the simple-model interpretation.

&lt;div class="student-note"&gt;A complete coefficient sentence names the outcome, comparison size, controls, uncertainty, sample, and associational claim boundary.&lt;/div&gt;

???

12 minutes: 4 to run and read, 4 to write, 2 for a pair check, and 2 for feedback. Expected adjusted 500 lb contrast: about 2.81 fewer MPG, approximate HC3 interval 2.33 to 3.29 fewer. Controls are horsepower, year, and origin. The simple-model contrast is 3.74 fewer MPG. Association remains the claim boundary.

# 3. Check the curve and prediction mistakes - 12 minutes

Run notebook **3**.

Compare the straight and curved fitted lines, then inspect the residual plots.

1. Describe one remaining visual pattern in plain language.

2. Explain the fitted weight-MPG relationship near **3,000 lb**.

3. State what HC3 changes and one research problem it cannot fix.

Compare your observations with a neighbour.

&lt;div class="student-note"&gt;A residual is actual MPG minus predicted MPG. Look for a random cloud around zero rather than a curve or widening funnel.&lt;/div&gt;

???

12 minutes: 4 to run and inspect, 4 to write, 2 in pairs, and 2 to debrief. The local quadratic slope at 3,000 lb is -6.50 MPG per 1,000 lb. Let students report defensible visual patterns rather than force one diagnosis. Discuss changing variance and sparse support. A Q–Q plot concerns residual shape, not normality of predictors.

# 4. Investigate an influential vehicle - 10 minutes

Run notebook **4**.

Find the vehicle with the largest Cook's distance and inspect its original values and name.

Compare the estimate using all records with the estimate after temporarily leaving out this one vehicle.

**Write:** “This check tells us ... It cannot prove ...”

Keep a valid unusual record in the main analysis unless source evidence supports a correction.

&lt;div class="student-note"&gt;The goal is not to remove inconvenient data. The goal is to understand why a record matters and whether the conclusion depends on it.&lt;/div&gt;

???

10 minutes: 3 to run and inspect, 3 to write, 2 in pairs, and 2 to debrief. Largest Cook-distance record is 327, vw dasher (diesel). The local slope changes from -6.50 to -6.59. This is a check on one-record sensitivity. A valid unusual record may reveal omitted technology rather than a source error.

- the Lasso penalty setting and number of retained features

- where missing values and scaling are learned

# Optional: logging MPG changes the meaning of coefficients

Taking the logarithm of MPG changes the question from an MPG difference to an approximate percentage difference.

**Simple interpretation for a small coefficient:** a one-unit increase in X is associated with roughly **100 × b percent** change in fitted MPG, holding other included variables fixed.

For larger changes, software should calculate the exact percentage using the exponential transformation.

&lt;div class="student-note"&gt;Use a log outcome only when a percentage interpretation fits the research question. Do not choose it simply because it looks more technical.&lt;/div&gt;

???

Optional, outside the core. MPG is positive, so the log is defined. The exact percentage expression concerns the fitted geometric outcome. Recovering an expected arithmetic outcome needs retransformation assumptions or a suitable correction. Avoid comparing log and level R² as if the outcome scale were identical.

&lt;div class="student-note"&gt;&lt;strong&gt;Interaction:&lt;/strong&gt; the association of one variable depends on another variable. Interpret the combined slope at meaningful values, not one coefficient by itself.&lt;/div&gt;

???

Optional real-data training estimates from the centered interaction model. The displayed values are point estimates, not uncertainty claims about differences across years. Use a linear contrast and the full coefficient covariance for inference on a derived slope. Do not interpret the association as identified technological change.

# Optional: Elastic Net blends Ridge and Lasso

Elastic Net combines the two regularization ideas:

- Ridge-style shrinkage can stabilize groups of related predictors.
- Lasso-style shrinkage can set some coefficients to zero.

Training cross-validation chooses both the overall penalty strength and the balance between the two styles.

&lt;div class="student-note"&gt;Elastic Net is another prediction option, not evidence that selected variables are causal.&lt;/div&gt;

???

Optional section 9B. Elastic Net tunes alpha and the L1 ratio using training CV. The extension does not evaluate the already-opened test set again. A genuinely new final model comparison needs fresh assessment. Regularization still does not establish causes.

---

class: small

# The word “robust” can mean different things

| Term | Plain-language meaning |
|---|---|
| HC3 robust standard errors | Keep the OLS estimates but report uncertainty that better handles uneven residual spread |
| Huber robust regression | Fit the line while reducing the effect of very large residuals |
| Robustness or sensitivity check | Change one reasonable analysis choice and see whether the conclusion changes |

&lt;div class="student-note"&gt;Always name the specific problem being addressed. “Robust” never means that every research problem has been solved.&lt;/div&gt;

???

Optional section 9B fits Huber robust linear regression using the same formula and training sample. Huber changes the loss function, while HC3 changes covariance estimates. Huber does not protect against every leverage problem or specification error. Each procedure needs a stated purpose.

---

# The outcome type guides the model choice

| Outcome | Possible starting model |
|---|---|
| Yes/no event | Logistic regression |
| Number of events | A count model such as Poisson regression |
| Typical or median outcome | Quantile regression |
| Repeated observations of countries or firms | A model that accounts for repeated records and dependence |

&lt;div class="student-note"&gt;These are starting points, not automatic choices. Students should justify the model using the outcome, research design, and claim.&lt;/div&gt;

???

Orientation only. These alternatives are beyond the core lab. Logistic coefficients are log-odds, not percentage-point effects. Count outcomes may need special treatment of dispersion and exposure. Repeated observations need dependence-aware estimation. The simplest adequate method is a defensible choice.

---

class: small

# Tools for the research workflow

| Task | Software used here |
|---|---|
| Inspect, document, join data | pandas |
| OLS, formulas, HC3, influence | statsmodels |
| Scaling, CV, Ridge and Lasso | scikit-learn |
| Plots | matplotlib |
| Run and save the analysis | JupyterLab or Google Colab |

R alternatives include `lm`, `sandwich` and `glmnet`.

&lt;div class="student-note"&gt;Software organizes calculations, but the researcher must still justify variables, transformations, assumptions, and claims.&lt;/div&gt;

???

Python is the supplied workflow. The R alternatives are optional names, not additional installations or assignments. Spreadsheet inspection can help, but record transformations in code. The notebook exports software versions so the analysis can be reconstructed.

---

# A results paragraph connects methods to claims

“Using 294 complete training records from the historical Auto MPG data, I estimated an OLS model of MPG on weight, horsepower, model year and origin. A 1,000 lb weight difference was associated with **5.61 fewer MPG** (approximate 95% HC3 interval: **4.65 to 6.57 fewer**). The estimate describes an adjusted association. Unrecorded design differences and possible dependence among related models limit causal interpretation.”

&lt;div class="student-note"&gt;The paragraph moves from sample and specification to estimate and uncertainty, then ends with the claim boundary and limitation.&lt;/div&gt;

???

Instructor example for a careful results paragraph. The interval describes approximate independent-record model uncertainty. The specification has been explored for teaching, so avoid calling the result preregistered confirmation. Students should add a diagnostic or sensitivity finding when assembling their own 80–120 words.

---

class: small

# Reporting checklist

- Research question, unit of observation and sample flow

- Outcome and predictor definitions with units

- Specification and why it fits the literature

- Estimates and uncertainty, or a validation design and errors

- Diagnostic findings and documented robustness checks

- Limits to generalization and causal interpretation

- Data source, code, versions, references and AI-use disclosure

&lt;div class="student-note"&gt;A reader should be able to trace every reported claim back to a defined sample, variable, model, diagnostic, and source.&lt;/div&gt;

???

Connect to the complete final paper. Introduction and literature motivate the question, Data and Methods explain choices, Results present evidence, Discussion and Limitations bound claims, and the Conclusion answers the question. Week 14 joins these sections into a composite draft. No student needs every model shown here.

# Data and technical references

**Data:** Quinlan, R. (1993). *Auto MPG*. UCI Machine Learning Repository. [doi.org/10.24432/C5859H](https://doi.org/10.24432/C5859H). CC BY 4.0.

**Units:** [ISLR2 authors’ Auto documentation](https://search.r-project.org/CRAN/refmans/ISLR2/html/Auto.html).

**OLS and diagnostics:** [statsmodels HC3](https://www.statsmodels.org/stable/generated/statsmodels.regression.linear_model.OLSResults.HC3_se.html) and [regression diagnostics](https://www.statsmodels.org/stable/examples/notebooks/generated/regression_diagnostics.html).

**Prediction:** scikit-learn [linear models](https://scikit-learn.org/stable/modules/linear_model.html) and [data leakage guidance](https://scikit-learn.org/stable/common_pitfalls.html).

&lt;div class="student-note"&gt;Primary data and software documentation make the analysis auditable and help distinguish source facts from the researcher's modelling choices.&lt;/div&gt;

???

The notebook embeds unchanged UCI raw data and metadata, checks their hashes, and exports versions and results. All reported observations are real. Cross-validation and test scores depend on the fixed split and model settings. Technical links are primary documentation rather than invented references.
